<!-- sandbox_Three.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sandbox Island</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #three-root { position: fixed; inset: 0; }
    /* Floating HUD (optional) */
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.35); color: #fff; padding: 8px 12px; border-radius: 10px;
      font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      backdrop-filter: blur(4px);
    }
    .disabled { opacity: .5; pointer-events: none; }
    .clickable { cursor: pointer; }
  </style>
  <script src="/scripts/Header.js" type="text/javascript" defer></script>
</head>
<body>
  <div id="nav-slider"></div>
  <div id="three-root"></div>
  <div class="hud">Sandbox Island • click a floating toy to open its playground</div>
  <script type="importmap">
    {
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
    }
  </script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { Water } from 'https://unpkg.com/three@0.160.0/examples/jsm/objects/Water2.js';

    // ---------- basic scene ----------
    const root = document.getElementById('three-root');
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x6fb3e3, 250, 1200);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(140, 140, 220);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    root.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 60;
    controls.maxDistance = 600;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ---------- lights ----------
    scene.add(new THREE.HemisphereLight(0xe1efff, 0x334155, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(200, 300, 150);
    scene.add(sun);

    // --- water plane (local textures + safe fallback) ---
    const waterGeom = new THREE.PlaneGeometry(4000, 4000);

    const loader = new THREE.TextureLoader();
    const TEX_PATH = '../resources/textures/';

    function loadTex(name){
      return new Promise((resolve, reject) => {
        loader.load(
          TEX_PATH + name,
          (tex) => {
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            resolve(tex);
          },
          undefined,
          reject
        );
      });
    }

    // A 2×2 “flat” normal map: rgb(128,128,255)
    function makeFlatNormal(){
      const size = 2;
      const data = new Uint8Array(size*size*3);
      for (let i=0;i<size*size;i++){
        data[i*3 + 0] = 128;
        data[i*3 + 1] = 128;
        data[i*3 + 2] = 255;
      }
      const tex = new THREE.DataTexture(data, size, size, THREE.RGBFormat);
      tex.needsUpdate = true;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    let water; // define here so animate can see it

    Promise
      .all([
        loadTex('Water_1_M_Normal.jpg').catch(() => makeFlatNormal()),
        loadTex('Water_2_M_Normal.jpg').catch(() => makeFlatNormal()),
      ])
      .then(([normal0, normal1]) => {
        water = new Water(waterGeom, {
          color: 0x3aa0e0,
          scale: 3,
          flowDirection: new THREE.Vector2(1, 1),
          textureWidth: 1024,
          textureHeight: 1024,
          normalMap0: normal0,
          normalMap1: normal1
        });
        water.rotation.x = -Math.PI / 2;
        water.position.y = 15;
        scene.add(water);
      });

    // ---------- island ----------
    const island = new THREE.Group();
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xd9c28b, roughness: 0.95, metalness: 0.0 });
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b5b4d, roughness: 1.0, metalness: 0.0 });

    const base = new THREE.Mesh(new THREE.CylinderGeometry(80, 360, 10, 10), rockMat);
    base.position.y = -10; // below water a bit
    base.castShadow = base.receiveShadow = true;
    island.add(base);

    const sand = new THREE.Mesh(new THREE.SphereGeometry(100, 42, 21), sandMat);
    sand.scale.set(1.2, 0.35, 1.0); // squash for a blobby dune
    sand.position.y = 22;
    sand.castShadow = sand.receiveShadow = true;
    island.add(sand);

    island.position.set(0, 0, 0);
    scene.add(island);

    // ---------- "toys" (click to navigate) ----------
    const toys = [
      { key: 'astar',  label: 'A*',          color: 0xf1c40f, link: 'sandbox_Astar.html',  pos: new THREE.Vector3(-40, 55,  30) },
      { key: 'sand',   label: 'Sand',        color: 0x22c55e, link: 'sandbox.html',        pos: new THREE.Vector3( 50, 62, -10) },
      { key: 'golden', label: 'Golden',      color: 0xfb7185, link: 'sandbox_Golden.html', pos: new THREE.Vector3(  5, 70,  55) },
    ];

    const toyGroup = new THREE.Group();
    const toyMeshes = [];

    for (const t of toys) {
      const body = new THREE.Mesh(
        new THREE.IcosahedronGeometry(8, 1),
        new THREE.MeshStandardMaterial({ color: t.color, roughness: .25, metalness: .91, emissive: 0x000000 })
      );
      body.position.copy(t.pos);
      body.userData = { link: t.link, key: t.key, label: t.label, hover: false };
      body.name = `toy:${t.key}`;
      toyGroup.add(body);
      toyMeshes.push(body);

      // little stem so it looks like a buoy
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 10, 8),
        new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 })
      );
      stem.position.copy(t.pos).setY(t.pos.y - 12);
      toyGroup.add(stem);
    }
    scene.add(toyGroup);

    // ---------- raycast for clicks/hover ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function onPointerMove(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }
    function onClick() {
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(toyMeshes, true)[0];
      if (hit) {
        const mesh = hit.object;
        // quick feedback pulse
        mesh.scale.setScalar(1.25);
        setTimeout(() => { mesh.scale.setScalar(1); }, 120);
        const { link } = mesh.userData;
        if (link) window.location.href = link;
      }
    }
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('click', onClick);

    // ---------- resize ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- animate ----------
    const clock = new THREE.Clock();
    let running = true;
    document.addEventListener('visibilitychange', () => { running = !document.hidden; });

    (function animate(){
      requestAnimationFrame(animate);
      if (!running) return;

      if (water?.material?.uniforms?.time) {
        water.material.uniforms.time.value += clock.getDelta();
      }
      // gentle bob for toys
      for (let i = 0; i < toyMeshes.length; i++) {
        const m = toyMeshes[i];
        m.position.y += Math.sin(performance.now() * 0.001 + i) * 0.02;
        m.rotation.y += 0.01;
      }
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
